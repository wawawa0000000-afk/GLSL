<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>錯視 - 不可能な三角形</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

const VS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FS = `
precision highp float;
uniform vec2 iResolution;
uniform vec4 iMouse;
uniform float iTime;

// ---- カプセル(丸棒)のSDF ----
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
    vec3 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * h) - r;
}

const vec2 V0 = vec2(0.0, 1.6);
const vec2 V1 = vec2(-1.3856, -0.8);
const vec2 V2 = vec2(1.3856, -0.8);

float map(vec3 p) {
    float d0 = sdCapsule(p, vec3(V0.x, 0.0, V0.y), vec3(V1.x, 1.0, V1.y), 0.28);
    float d1 = sdCapsule(p, vec3(V1.x, 0.0, V1.y), vec3(V2.x, 1.0, V2.y), 0.28);
    float d2 = sdCapsule(p, vec3(V2.x, 0.0, V2.y), vec3(V0.x, 1.0, V0.y), 0.28);
    return min(d0, min(d1, d2));
}

vec3 calcNormal(vec3 p) {
    const float h = 0.0001;
    const vec2 k = vec2(1.0, -1.0);
    return normalize(
        k.xyy * map(p + k.xyy * h) +
        k.yyx * map(p + k.yyx * h) +
        k.yxy * map(p + k.yxy * h) +
        k.xxx * map(p + k.xxx * h)
    );
}

float rayMarch(vec3 ro, vec3 rd) {
    float t = 0.0;
    for (int i = 0; i < 100; i++) {
        vec3 p = ro + rd * t;
        float d = map(p);
        if (d < 0.001) return t;
        if (t > 50.0) break;
        t += d;
    }
    return -1.0;
}

mat3 setCamera(vec3 ro, vec3 ta, vec3 upHint) {
    vec3 cw = normalize(ta - ro);
    vec3 cu = normalize(cross(cw, upHint));
    vec3 cv = cross(cu, cw);
    return mat3(cu, cv, cw);
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;

    float az = 1.5707963;
    float el = 0.05;
    if (iMouse.z > 0.0) {
        vec2 m = iMouse.xy / iResolution.xy;
        az = m.x * 6.2831853;
        el = m.y * 1.3;
    }
    float dist = 8.0;
    vec3 ro = dist * vec3(sin(el) * cos(az), cos(el), sin(el) * sin(az));
    vec3 ta = vec3(0.0, 0.5, 0.0);
    mat3 cam = setCamera(ro, ta, vec3(0.0, 0.0, 1.0));
    vec3 rd = cam * normalize(vec3(uv, 1.8));

    vec3 col = vec3(0.05, 0.06, 0.08);

    float t = rayMarch(ro, rd);
    if (t > 0.0) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        vec3 lightDir = normalize(vec3(0.6, 0.9, 0.4));
        float diff = clamp(dot(n, lightDir), 0.0, 1.0);
        float amb = 0.25;
        col = vec3(0.9, 0.35, 0.2) * (diff + amb);
    }

    fragColor = vec4(col, 1.0);
}

void main() {
    vec4 col;
    mainImage(col, gl_FragCoord.xy);
    gl_FragColor = col;
}
`;

function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s));
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes   = gl.getUniformLocation(prog, 'iResolution');
const uMouse = gl.getUniformLocation(prog, 'iMouse');
const uTime  = gl.getUniformLocation(prog, 'iTime');

let mouse = { x: 0, y: 0, down: false };

canvas.addEventListener('mousedown', e => {
    mouse.down = true;
    mouse.x = e.clientX;
    mouse.y = canvas.clientHeight - e.clientY;
});
canvas.addEventListener('mousemove', e => {
    if (mouse.down) {
        mouse.x = e.clientX;
        mouse.y = canvas.clientHeight - e.clientY;
    }
});
canvas.addEventListener('mouseup',   () => { mouse.down = false; });
canvas.addEventListener('mouseleave',() => { mouse.down = false; });

// タッチ操作
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.down = true;
    mouse.x = t.clientX;
    mouse.y = canvas.clientHeight - t.clientY;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = canvas.clientHeight - t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.down = false; });

function resize() {
    canvas.width  = canvas.clientWidth  * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const t0 = performance.now();

function render() {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform4f(uMouse,
        mouse.x * devicePixelRatio,
        mouse.y * devicePixelRatio,
        mouse.down ? 1.0 : 0.0,
        0.0
    );
    gl.uniform1f(uTime, (performance.now() - t0) / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
